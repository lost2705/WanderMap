spring:
  application:
    name: wandermap
  datasource:
    url: ${WANDERMAP_DB_URL:jdbc:postgresql://localhost:5432/wandermap}
    username: ${WANDERMAP_DB_USERNAME:wandermap}
    password: ${WANDERMAP_DB_PASSWORD:wandermap}
    hikari:
      data-source-properties:
        # Constraint error details can contain private city names, coordinates and other row values.
        logServerErrorDetail: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: ${WANDERMAP_PHOTOS_MAX_SIZE:10MB}
      max-request-size: ${WANDERMAP_PHOTOS_MAX_SIZE:10MB}

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health

wandermap:
  auth:
    jwt-secret: ${WANDERMAP_JWT_SECRET:}
    token-ttl: ${WANDERMAP_AUTH_TOKEN_TTL:12h}
    secure-cookie: ${WANDERMAP_AUTH_COOKIE_SECURE:true}
  geocoding:
    base-url: ${WANDERMAP_GEOCODING_BASE_URL:https://photon.komoot.io}
    user-agent: ${WANDERMAP_GEOCODING_USER_AGENT:WanderMap/0.1}
    connect-timeout-millis: ${WANDERMAP_GEOCODING_CONNECT_TIMEOUT_MILLIS:2000}
    read-timeout-millis: ${WANDERMAP_GEOCODING_READ_TIMEOUT_MILLIS:4000}
  storage:
    photos:
      root: ${WANDERMAP_PHOTOS_ROOT:./data/photos}
      max-size: ${WANDERMAP_PHOTOS_MAX_SIZE:10MB}
  ai:
    enabled: ${WANDERMAP_AI_ENABLED:false}
    provider: ${WANDERMAP_AI_PROVIDER:openai}
    model: ${WANDERMAP_AI_MODEL:gpt-5-mini}
    max-tool-iterations: ${WANDERMAP_AI_MAX_TOOL_ITERATIONS:6}
    max-tool-calls: ${WANDERMAP_AI_MAX_TOOL_CALLS:12}
    max-tool-result-characters: ${WANDERMAP_AI_MAX_TOOL_RESULT_CHARACTERS:100000}
    max-output-tokens: ${WANDERMAP_AI_MAX_OUTPUT_TOKENS:4000}
    connect-timeout: ${WANDERMAP_AI_CONNECT_TIMEOUT:3s}
    read-timeout: ${WANDERMAP_AI_READ_TIMEOUT:45s}
    openai:
      base-url: ${WANDERMAP_OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
    weather:
      base-url: ${WANDERMAP_WEATHER_BASE_URL:https://api.open-meteo.com}
      connect-timeout: ${WANDERMAP_WEATHER_CONNECT_TIMEOUT:2s}
      read-timeout: ${WANDERMAP_WEATHER_READ_TIMEOUT:5s}

---
spring:
  config:
    activate:
      on-profile: local

wandermap:
  auth:
    secure-cookie: ${WANDERMAP_AUTH_COOKIE_SECURE:false}
