services:
  database:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wandermap}
      POSTGRES_USER: ${POSTGRES_USER:-wandermap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wandermap}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - wandermap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wandermap-postgres-data:

